<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Set a New Password</h2>
  <form id="reset-form">
    <input type="password" id="new-password" placeholder="Enter new password" required minlength="6" />
    <button type="submit">Update Password</button>
  </form>
  <p id="message"></p>

  <script>
    const SUPABASE_URL = 'https://hxsubmacyeprcvckpjuj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Hrhr0EMdvwFjaPqaHyE_kg_k00oq4hw';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('reset-form');
    const messageEl = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('new-password').value;

      const { error } = await supabaseClient.auth.updateUser({ password });

      if (error) {
        messageEl.textContent = 'Error: ' + error.message;
      } else {
        messageEl.textContent = 'Password updated! Redirecting to login...';
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);
      }
    });
  </script>
</body>
</html>
