<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Az-Zikr International</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #f4f9f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.08);
            width: 100%;
            max-width: 420px;
            border: 1px solid #d4ebd4;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #2e7d32;
        }
        .auth-header h2 {
            margin: 0 0 8px 0;
            color: #1a2e05;
            font-size: 1.6rem;
        }
        .auth-header p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #1a2e05;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .input-with-icon {
            position: relative;
        }
        .input-with-icon i.field-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #2e7d32;
        }
        .input-with-icon input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-with-icon input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
        }
        .btn-submit {
            width: 100%;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #1a2e05;
        }
        .auth-status {
            margin-top: 12px;
            font-size: 0.88rem;
            text-align: center;
            min-height: 18px;
        }
        .auth-status.success {
            color: #2e7d32;
            font-weight: 600;
        }
        .auth-status.error {
            color: #c62828;
            font-weight: 600;
        }
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #666;
        }
        .auth-footer a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <img src="logo.jpeg" alt="Az-Zikr Logo">
            <h2>Set New Password</h2>
            <p>Enter your new password below</p>
        </div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
                    <i class="fa-solid fa-eye toggle-password" id="toggleNewPassword"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter new password">
                </div>
            </div>

            <button type="submit" id="resetBtn" class="btn-submit">Update Password</button>
            <div id="resetStatus" class="auth-status"></div>
        </form>

        <div class="auth-footer">
            Back to <a href="login.html">Log In</a>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            'httpshxsubmacyeprcvckpjuj.supabase.co'.replace('https', 'https://'),
            'sb_publishable_Hrhr0EMdvwFjaPqaHyE_kg_k00oq4hw',
            {
                auth: {
                    persistSession: true,
                    storage: window.localStorage
                }
            }
        );

        const toggleNewPassword = document.getElementById('toggleNewPassword');
        const newPasswordInput = document.getElementById('newPassword');
        const resetStatus = document.getElementById('resetStatus');

        function setResetStatus(msg, type = '') {
            resetStatus.textContent = msg;
            resetStatus.className = 'auth-status' + (type ? ' ' + type : '');
        }

        toggleNewPassword.addEventListener('click', function () {
            const type = newPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            newPasswordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const resetBtn = document.getElementById('resetBtn');
            const password = newPasswordInput.value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                setResetStatus("Passwords do not match.", "error");
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = "Updating...";
            setResetStatus("");

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: password
                });

                if (error) {
                    setResetStatus("Could not update password: " + error.message, "error");
                    resetBtn.disabled = false;
                    resetBtn.textContent = "Update Password";
                    return;
                }

                setResetStatus("Password updated successfully! Redirecting to login...", "success");
                setTimeout(() => {
                    window.location.replace('login.html');
                }, 1500);
            } catch (err) {
                console.error("Unexpected error updating password:", err);
                setResetStatus("An unexpected error occurred. Please try again.", "error");
                resetBtn.disabled = false;
                resetBtn.textContent = "Update Password";
            }
        });
    </script>
</body>
</html>
