<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Az-Zikr International</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            background-color: #f4f9f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.08);
            width: 100%;
            max-width: 420px;
            border: 1px solid #d4ebd4;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #2e7d32;
        }
        .auth-header h2 {
            margin: 0 0 8px 0;
            color: #1a2e05;
            font-size: 1.6rem;
        }
        .auth-header p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #1a2e05;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .input-with-icon {
            position: relative;
        }
        .input-with-icon i.field-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #2e7d32;
        }
        .input-with-icon input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-with-icon input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
        }
        .btn-submit {
            width: 100%;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #1a2e05;
        }
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #666;
        }
        .auth-footer a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <img src="logo.jpeg" alt="Az-Zikr Logo">
            <h2>Create Account</h2>
            <p>Register to get started with your student portal</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-envelope field-icon"></i>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="password" required placeholder="Create a password (min 6 chars)">
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" id="signupBtn" class="btn-submit">Sign Up</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Log in here</a>
        </div>
    </div>

    <script>
        // Initialize Supabase with session persistence enabled
        const supabaseClient = supabase.createClient(
            'https://hxsubmacyeprcvckpjuj.supabase.co',
            'sb_publishable_Hrhr0EMdvwFjaPqaHyE_kg_k00oq4hw',
            {
                auth: {
                    persistSession: true,
                    storage: window.localStorage
                }
            }
        );

        // Password visibility toggle feature
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Handle Registration Form Submission (Database Trigger handles public.profiles insertion)
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('signupBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (password.length < 6) {
                alert("Password must be at least 6 characters long.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating Account...";

            try {
                // Register user in Supabase Auth (Postgres trigger automatically provisions public.profiles)
                const { error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (authError) {
                    alert("Registration failed: " + authError.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Sign Up";
                    return;
                }

                alert("Registration successful! Please log in with your new account.");
                window.location.replace('login.html');

            } catch (err) {
                console.error("Unexpected error during signup:", err);
                alert("An unexpected error occurred. Please try again.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign Up";
            }
        });
    </script>
</body>
</html>
