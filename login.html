<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login - Az-Zikr International</title>
</head>
<body>

    <h2>Student Portal Login</h2>

    <!-- Login Form -->
    <form id="login-form">
        <input type="email" id="email" placeholder="Student Email or ID" required>
        <br><br>
        <input type="password" id="password" placeholder="Password" required>
        <br><br>
        <button type="submit">Login to Courses</button>
    </form>

    <!-- Supabase CDN and Authentication Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Replace with your actual Supabase Project URL and Anon Key
        const supabaseUrl = 'https://hxsubmacyeprcvckpjuj.supabase.co';
        const supabaseKey = 'sb_publishable_Hrhr0EMdvwFjaPqaHyE_kg_k00oq4hw';
        
        // Initialized once here
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                alert('Login failed: ' + error.message);
            } else {
                window.location.href = '/dashboard.html'; 
            }
        });
    </script>

</body>
</html>
