<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Az-Zikr International</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .login-wrapper {
            max-width: 450px;
            margin: 60px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #d4ebd4;
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.08);
        }
        .login-wrapper h2 {
            color: #1a2e05;
            margin-bottom: 10px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
        }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #4b5563;
        }
        .btn-submit {
            width: 100%;
            background: #2e7d32;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #1b5e20;
        }
        #errorMsg {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.jpeg" alt="Logo" class="site-logo">
            <span class="logo-text">Az-Zikr International</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="enroll.html">Enroll Now</a>
        </nav>
    </header>

    <main>
        <div class="login-wrapper">
            <h2>Student Portal Login</h2>
            <p style="text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 30px;">Sign in to access your course dashboard.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="student@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <!-- Remember Me Row -->
                <div class="remember-row">
                    <input type="checkbox" id="rememberMe" checked>
                    <label for="rememberMe" style="margin-bottom: 0; cursor: pointer;">Remember me on this device</label>
                </div>

                <button type="submit" class="btn-submit"><i class="fa-solid fa-right-to-bracket"></i> Sign In & Access Hub</button>
                <div id="errorMsg"></div>
            </form>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'httpshxsubmacyeprcvckpjuj.supabase.co'; // verify your project URL string format if needed
        // Using correct initialization with persistence config
        const supabaseClient = supabase.createClient(
            'https://hxsubmacyeprcvckpjuj.supabase.co', 
            'sb_publishable_Hrhr0EMdvwFjaPqaHyE_kg_k00oq4hw',
            {
                auth: {
                    persistSession: true,
                    storage: window.localStorage
                }
            }
        );

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = "";

            const urlParams = new URLSearchParams(window.location.search);
            const selectedCourse = urlParams.get('course');
            if (selectedCourse) {
                localStorage.setItem('enrolled_course', selectedCourse);
            }

            // Authenticate with Supabase
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                // Auto sign-up fallback helper for smooth testing
                const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });
                
                if (signUpError) {
                    errorDiv.textContent = signUpError.message;
                    return;
                }
            }

            // If "Remember Me" is checked, storage handles session persistence automatically.
            window.location.href = 'student-hub.html';
        });
    </script>
</body>
</html>
