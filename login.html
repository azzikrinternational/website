        body {

            color: #333;

            min-height: 100vh;
        }
        header {

        .logo-container {

            text-decoration: none;
        }
        .site-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2e7d32;
        }
        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2e7d32;

        .header-nav {
            display: flex;
            gap: 20px;

        }

            text-decoration: none;
            color: #444;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .header-nav a:hover {
            color: #2e7d32;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Decorative top accent border */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #2e7d32, #c9933b);
        }

        .login-header-icon {
            width: 55px;
            height: 55px;
            background: #f0fdf4;
            color: #2e7d32;

            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin: 0 auto 18px auto;
            border: 1px solid #d4ebd4;
        }

        .login-card h2 {
            color: #1a2e05;
            margin-top: 0;
            margin-bottom: 6px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
        }
        .login-card p.subtitle {
            text-align: center;
            color: #666;
            font-size: 0.92rem;
            margin-bottom: 30px;
        }
