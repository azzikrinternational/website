    <!-- Enhanced Modern Styling -->
    <style>
        .enroll-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Section Header Styling */
        .section-category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            color: #1a2e05;
            margin: 40px 0 20px 0;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        .section-category-header i {
            color: #2e7d32;
        }

        /* Featured Web Portal Course Card */
        .portal-feature-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .portal-highlight-card {
            background: linear-gradient(135deg, #ffffff 0%, #f4fdf4 100%);
            border-radius: 16px;
            border: 2px solid #bbf7d0;
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.08);
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .portal-highlight-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #2e7d32, #c9933b);
        }

        .portal-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .portal-badge {
            background: #2e7d32;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .portal-highlight-card h4 {
            margin: 0 0 10px 0;
            color: #1a2e05;
            font-size: 1.7rem;
            font-weight: 700;
        }

        .portal-highlight-card p {
            color: #4b5563;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .portal-features-list {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .portal-feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.92rem;
            color: #374151;
            font-weight: 500;
        }

        .portal-feature-item i {
            color: #2e7d32;
        }

        .btn-portal-action {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
            transition: all 0.2s ease;
            width: fit-content;
        }

        .btn-portal-action:hover {
            background: linear-gradient(135deg, #388e3c, #2e7d32);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(46, 125, 50, 0.35);
        }

        @media (max-width: 768px) {
            .portal-highlight-card {
                padding: 25px 20px;
            }
            .btn-portal-action {
                width: 100%;
            }
        }
    </style>
