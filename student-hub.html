<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    
    <!-- Title & Description -->
    <title>Student Portal Hub | Az-Zikr International</title>
    <meta name="description" content="Manage your enrolled Islamic courses, track your learning progress, and explore new departments.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Page Styling -->
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f9f4;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #ffffff;
            border-bottom: 1px solid #d4ebd4;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .site-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2e7d32;
        }
        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2e7d32;
        }
        .header-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .header-nav a {
            text-decoration: none;
            color: #444;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .header-nav a:hover {
            color: #2e7d32;
        }
        .btn-logout {
            background: #fee2e2;
            color: #991b1b;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-logout:hover {
            background: #fecaca;
        }

        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 35px;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.2);
        }
        .welcome-banner h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }
        .welcome-banner p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .section-heading {
            font-size: 1.3rem;
            color: #1a2e05;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Course Grid Section */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 45px;
        }

        .course-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 24px;
            border: 1px solid #d4ebd4;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .course-card h3 {
            margin-top: 0;
            color: #2e7d32;
            font-size: 1.15rem;
            margin-bottom: 8px;
        }

        .course-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 20px;
        }
