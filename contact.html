    <meta property="og:url" content="https://azzikrinternational.com/contact.html">
    <meta property="og:title" content="Contact Us | Az-Zikr International">
    <meta property="og:description" content="Reach out to us via WhatsApp or our social channels.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-navy: #1a365d;
            --bg-light: #f4f6f8;
            --border-color: #d1d5db;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            color: #333333;
            line-height: 1.6;
        }

        /* Exact Index Header Styling */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(5, 15, 30, 0.75) 0%, rgba(5, 15, 30, 0.2) 100%) !important;
            backdrop-filter: blur(3px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 30px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .site-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
        }
        .logo-text {
            color: #ffffff !important;
            font-weight: 800;
            font-size: 1.25rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.8);
        }
        header nav a, .header-socials a, .dropdown-btn {
            color: #ffffff !important;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.8);
            font-weight: 500;
            text-decoration: none;
            font-size: 0.95rem;
        }
        header nav a:hover, .dropdown:hover .dropdown-btn {
            color: #f3c669 !important;
        }

        /* Clean Dropdown Menu */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-btn {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: rgba(5, 15, 30, 0.95);
            min-width: 140px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            border-radius: 6px;
            z-index: 1;
            top: 100%;
            left: 0;
            padding: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .dropdown-content a {
            color: #ffffff !important;
            padding: 8px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            text-shadow: none !important;
        }
        .dropdown-content a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #f3c669 !important;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
